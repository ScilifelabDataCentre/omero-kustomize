apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omeroweb-http-routes
spec:
  parentRefs:
    - name: omero-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - "omero.example.com"
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
        - name: omeroweb
          port: 4080
    - matches:
      - path:
          type: PathPrefix
          value: /webclient/get_thumbnails
      - path:
          type: PathPrefix
          value: /webclient/render_birds_eye_view
      - path:
          type: PathPrefix
          value: /webgateway/render_thumbnail
      - path:
          type: PathPrefix
          value: /webgateway/get_thumbnails
      - path:
          type: PathPrefix
          value: /webgateway/render_birds_eye_view
      backendRefs:
        - name: omerothumbnail
          port: 8080
