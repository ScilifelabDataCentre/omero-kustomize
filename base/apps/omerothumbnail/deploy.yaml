apiVersion: apps/v1
kind: Deployment
metadata:
  name: omerothumbnail
  labels:
    app: omerothumbnail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omerothumbnail
  minReadySeconds: 10
  template:
    metadata:
      labels:
        app: omerothumbnail
    spec:
      terminationGracePeriodSeconds: 90
      initContainers:
        - name: wait-deps
          image: busybox
          command: ["sh","-c"]
          args:
            - >
              echo "Waiting for omeroserver:4064 and redis:6379";
              until nc -z omeroserver 4064; do sleep 2; done;
              until nc -z redis 6379; do sleep 2; done;
      containers:
        - name: omerothumbnail
          image: openmicroscopy/omero-ms-thumbnail
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /opt/ms/conf/config.yaml
              subPath: config.yaml
              readOnly: true
          startupProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          lifecycle:
            preStop:
              exec: { command: ["sh","-c","sleep 5"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      volumes:
        - name: config
          configMap:
            name: omerothumbnail-config
