apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  labels: { app: database }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels: { app: database }
    spec:
      securityContext:
        fsGroup: 70   # postgres UID on alpine
      initContainers:
        - name: fix-perms
          image: busybox
          securityContext: { runAsUser: 0 }
          command:
            - sh
            - -c
            - >
              chown -R 70:70 /var/lib/postgresql/data &&
              mkdir -p /var/lib/postgresql/data/pgdata &&
              chown -R 70:70 /var/lib/postgresql/data/pgdata || true
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      containers:
        - name: postgres
          image: postgres
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: omero-secrets, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: omero-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: omero-secrets, key: POSTGRES_PASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: database }
